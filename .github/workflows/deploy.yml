name: Inject Secrets and Deploy
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Tailwind CSS
        run: npx --yes tailwindcss@3 -c tailwind.config.js --content "*.html" -o tailwind.css --minify

      - name: Inject Secrets
        run: |
          # We use '@' as a separator in case your URL has '/' characters
          sed -i "s@process.env.SUPABASE_URL@${{ secrets.SUPABASE_URL }}@g" index.html
          sed -i "s@process.env.SUPABASE_KEY@${{ secrets.SUPABASE_KEY }}@g" index.html
          sed -i "s@process.env.SUPABASE_URL@${{ secrets.SUPABASE_URL }}@g" login.html
          sed -i "s@process.env.SUPABASE_KEY@${{ secrets.SUPABASE_KEY }}@g" login.html
          sed -i "s@process.env.SUPABASE_URL@${{ secrets.SUPABASE_URL }}@g" methodology.html
          sed -i "s@process.env.SUPABASE_KEY@${{ secrets.SUPABASE_KEY }}@g" methodology.html

      - name: Verify Secrets Were Injected
        run: |
          if grep -rl "process.env.SUPABASE" index.html login.html methodology.html; then
            echo "FATAL: One or more files still contain unsubstituted placeholders."
            echo "Check that SUPABASE_URL and SUPABASE_KEY are set in repo Settings > Secrets."
            exit 1
          fi
          echo "All secrets injected successfully."

      - name: Verify Secrets Are Non-Empty
        run: |
          for file in index.html login.html methodology.html; do
            if grep -Eq "(SB_URL|SB_KEY|SUPABASE_URL|SUPABASE_KEY) = ''" "$file"; then
              echo "FATAL: Secrets resolved to empty strings in $file."
              exit 1
            fi
          done
          echo "Secrets are non-empty in all files."

      - name: Install Minifier
        run: npm install -g html-minifier-terser

      - name: Minify Files
        run: |
          html-minifier-terser index.html \
            --collapse-whitespace \
            --remove-comments \
            --minify-js true \
            --minify-css true \
            -o index.html
          html-minifier-terser login.html \
            --collapse-whitespace \
            --remove-comments \
            --minify-js true \
            --minify-css true \
            -o login.html
          html-minifier-terser methodology.html \
            --collapse-whitespace \
            --remove-comments \
            --minify-js true \
            --minify-css true \
            -o methodology.html
          html-minifier-terser privacy.html \
            --collapse-whitespace \
            --remove-comments \
            --minify-js true \
            --minify-css true \
            -o privacy.html
          html-minifier-terser terms.html \
            --collapse-whitespace \
            --remove-comments \
            --minify-js true \
            --minify-css true \
            -o terms.html

      - name: Compute and Inject CSP Script Hashes
        run: node scripts/inject-csp-hashes.js

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
